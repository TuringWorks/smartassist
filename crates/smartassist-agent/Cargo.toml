[package]
name = "smartassist-agent"
version = "0.1.0"
edition = "2021"
description = "Agent runtime and session management for SmartAssist"
license = "MIT"
readme = "README.md"

[dependencies]
smartassist-core = { path = "../smartassist-core" }
smartassist-sandbox = { path = "../smartassist-sandbox" }
smartassist-channels = { path = "../smartassist-channels" }
smartassist-memory = { path = "../smartassist-memory" }
smartassist-plugin-sdk = { path = "../smartassist-plugin-sdk" }
smartassist-providers = { path = "../smartassist-providers" }
smartassist-learnings = { path = "../smartassist-learnings" }

# Async runtime
tokio = { version = "1.35", features = ["full", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP client (for model API calls)
reqwest = { version = "0.13", features = ["json", "rustls", "webpki-roots", "stream"], default-features = false }

# Streaming
tokio-stream = "0.1"
async-stream = "0.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.6", features = ["v4"] }

# Regex for pattern matching
regex = "1.10"

# Glob pattern matching
glob = "0.3"

# Diff for edit operations
similar = "3.2"

# URL parsing
url = "2.5"

# Random
rand = "0.10"

# Platform directories
dirs = "7.0"

# Encoding
base64 = "0.23"
hex = "0.4"
urlencoding = "2.1"

# Hashing
sha2 = "0.11"
sha1 = "0.11"
md5 = "0.8"

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# Archive
zip = "8.6"
tar = "0.4"
flate2 = "1.0"

# Network
hostname = "0.4"

# Browser automation (optional)
chromiumoxide = { version = "0.9", optional = true, default-features = false }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
mockall = "0.15"

[features]
default = []
browser = ["dep:chromiumoxide"]
anthropic = ["smartassist-providers/anthropic"]
openai = ["smartassist-providers/openai"]
google = ["smartassist-providers/google"]
ollama = ["smartassist-providers/ollama"]
deepseek = ["smartassist-providers/deepseek"]
moonshot = ["smartassist-providers/moonshot"]
openrouter = ["smartassist-providers/openrouter"]
qwen = ["smartassist-providers/qwen"]
zhipu = ["smartassist-providers/zhipu"]
all-providers = ["anthropic", "openai", "google", "ollama", "deepseek", "moonshot", "openrouter", "qwen", "zhipu"]
