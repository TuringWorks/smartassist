[package]
name = "smartassist-security"
version = "0.1.0"
edition = "2021"
description = "Security audit framework for SmartAssist"
license = "MIT"

[dependencies]
smartassist-core = { path = "../smartassist-core" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# File system
walkdir = "2.4"

# Regex for pattern matching
regex = "1.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
tempfile = "3.8"
