[package]
name = "smartassist-gateway"
version = "0.1.0"
edition = "2021"
description = "WebSocket gateway server for SmartAssist"
license = "MIT"

[dependencies]
smartassist-core = { path = "../smartassist-core" }
smartassist-agent = { path = "../smartassist-agent" }
smartassist-channels = { path = "../smartassist-channels" }
smartassist-learnings = { path = "../smartassist-learnings" }
smartassist-providers = { path = "../smartassist-providers", features = ["anthropic", "openai", "google"] }
smartassist-browser = { path = "../smartassist-browser", features = ["chromiumoxide"] }
smartassist-canvas = { path = "../smartassist-canvas" }
smartassist-talk = { path = "../smartassist-talk" }

# Async runtime
tokio = { version = "1.35", features = ["full", "sync"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Web server
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1.0"

# WebSocket
tokio-tungstenite = "0.21"

# Time
chrono = { version = "0.4", features = ["serde"] }

smartassist-cron = { path = "../smartassist-cron" }

# Cron scheduling
cron = "0.12"

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Random
rand = "0.8"

# System info
hostname = "0.3"

# Encoding
base64 = "0.22"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []

# Individual channel features
telegram = ["smartassist-channels/telegram"]
discord = ["smartassist-channels/discord"]
slack = ["smartassist-channels/slack"]
web = ["smartassist-channels/web"]
signal = ["smartassist-channels/signal"]
imessage = ["smartassist-channels/imessage"]
whatsapp = ["smartassist-channels/whatsapp"]
line = ["smartassist-channels/line"]
irc = ["smartassist-channels/irc"]
matrix = ["smartassist-channels/matrix"]
googlechat = ["smartassist-channels/googlechat"]
msteams = ["smartassist-channels/msteams"]
feishu = ["smartassist-channels/feishu"]
mattermost = ["smartassist-channels/mattermost"]
zalo = ["smartassist-channels/zalo"]

# Enable all channels at once
all-channels = [
    "telegram", "discord", "slack", "web", "signal", "imessage",
    "whatsapp", "line", "irc", "matrix", "googlechat", "msteams",
    "feishu", "mattermost", "zalo",
]
