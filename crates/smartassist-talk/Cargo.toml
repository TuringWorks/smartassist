[package]
name = "smartassist-talk"
version = "0.1.0"
edition = "2021"
description = "Voice talk system for SmartAssist"
license = "MIT"

[dependencies]
smartassist-core = { path = "../smartassist-core" }
smartassist-transcription = { path = "../smartassist-transcription" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Utilities
uuid = { version = "1.6", features = ["v4"] }
bytes = "1.5"
dashmap = "5.5"

[dev-dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
