[package]
name = "smartassist-memory"
version = "0.1.0"
edition = "2021"
description = "Vector memory and embeddings for SmartAssist"
license = "MIT"

[dependencies]
smartassist-core = { path = "../smartassist-core" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls", "webpki-roots"], default-features = false }

# Vector database
# NOTE: the "remote" feature works around an upstream bug in lancedb 0.38.0
# where src/job.rs references Error::Http unconditionally even though that
# variant is only defined under cfg(feature = "remote") in src/error.rs.
lancedb = { version = "0.38", optional = true, features = ["remote"] }
arrow = { version = "59", optional = true }

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"

[features]
default = []
lancedb = ["dep:lancedb", "dep:arrow"]
