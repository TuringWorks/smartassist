[package]
name = "smartassist-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP (Model Context Protocol) server/client for SmartAssist"
license = "MIT"

[dependencies]
smartassist-core = { path = "../smartassist-core" }
smartassist-agent = { path = "../smartassist-agent" }

# Async runtime
tokio = { version = "1.35", features = ["full", "process"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

# Utilities
uuid = { version = "1.6", features = ["v4"] }
dashmap = "5.5"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"

[dev-dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
