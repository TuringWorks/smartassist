[package]
name = "smartassist-bdd-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cucumber = "0.21"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }

smartassist-core = { path = "../../crates/smartassist-core" }
smartassist-gateway = { path = "../../crates/smartassist-gateway" }
smartassist-agent = { path = "../../crates/smartassist-agent" }
smartassist-channels = { path = "../../crates/smartassist-channels" }
smartassist-cli = { path = "../../crates/smartassist-cli" }
